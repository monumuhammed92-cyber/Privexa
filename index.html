<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080912"><title>PRIVEXA — Publish. Share. Sell.</title>
<style>
:root{--bg:#080912;--panel:#111423;--panel2:#171b2d;--line:#30364d;--text:#f5f6ff;--muted:#a5abc1;--purple:#a78bfa;--purple2:#6d4bd1;--cyan:#67e8f9;--red:#fb7185;--green:#86efac;--gold:#fcd34d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#272052 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button,.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:7px}button:hover,.btn:hover{border-color:var(--purple)}button.primary,.primary{background:var(--purple2);border-color:var(--purple2);font-weight:750;color:white}button.danger{color:#fecdd3;border-color:#7f1d32}button:disabled{opacity:.5;cursor:not-allowed}.wrap{width:min(1180px,100%);padding:16px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0 18px}.logo{font-size:28px;font-weight:950;letter-spacing:3px;color:#fff;text-decoration:none}.logo span{color:var(--purple)}nav{display:flex;gap:7px;flex-wrap:wrap}.hero{padding:30px 0 16px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:8px 0}.muted,p{color:var(--muted)}.tag{display:inline-block;font-size:11px;letter-spacing:.4px;border:1px solid var(--line);padding:3px 9px;border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.panel,.item{min-width:0;background:linear-gradient(145deg,var(--panel),#0d101a);border:1px solid var(--line);border-radius:17px;padding:17px}.panel h2,.panel h3{margin-top:0}.item h3{margin:9px 0 5px;overflow-wrap:anywhere}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 12px}.section h2{margin:0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{max-width:100%}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}.field{margin:10px 0}label{display:block;color:var(--muted);font-size:13px;margin:0 0 5px}input,textarea,select{width:100%;min-width:0;border:1px solid #3a4058;background:#0b0e18;color:var(--text);border-radius:10px;padding:11px}textarea{min-height:82px;resize:vertical}input[type=checkbox]{width:auto;accent-color:var(--purple)}.check{display:flex;gap:9px;align-items:center;margin:10px 0}.check label{margin:0}.notice{padding:12px 14px;border:1px solid #554577;background:#171527;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.error{border-color:#7f1d32;color:#fecdd3}.success{border-color:#166534;color:#bbf7d0}.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);grid-column:1/-1}.small{font-size:12px}.hidden{display:none!important}.price{color:var(--gold);font-weight:800}.footer{border-top:1px solid var(--line);padding:20px 0;margin-top:34px;color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{border-radius:999px}.stat{font-size:27px;font-weight:850}.listrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.listrow>div{min-width:0}.listrow h3{margin:0 0 4px;overflow-wrap:anywhere}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{overflow-wrap:anywhere;color:var(--cyan)}a{color:var(--cyan)}.right{margin-left:auto}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}.filelink{display:inline-block;margin-top:8px}.preview{max-width:100%;max-height:260px;border-radius:10px}.inline{display:inline}.mobilehint{font-size:12px;color:var(--muted)}
</style></head><body><div class="wrap"><header class="top"><a class="logo" href="#/">PRIV<span>EXA</span></a><nav><button onclick="go('/')">Explore</button><button onclick="go('/login')">Login</button><button class="primary" onclick="go('/register')">Create account</button><button onclick="go('/admin')">Admin</button><button id="signout" class="hidden" onclick="logout()">Sign out</button></nav></header><main id="app"><div class="notice">Loading PRIVEXA…</div></main><footer class="footer">PRIVEXA · Shared publishing platform · Public content is shared across devices. Paid content is released only after approval.</footer></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Browser-safe public key only. Never place service_role keys or database passwords here.
const SUPABASE_URL='https://qqpiypgxpavwpprpjxkd.supabase.co';
const SUPABASE_KEY='sb_publishable_OoVilLB7zgKMC4hb2C_kcQ_ZOcszdmE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n||0));let me=null,profile=null,admin=false,settings={upi_id:'',upi_name:'PRIVEXA'};let currentTab='overview';
function accessAllowed(p){return !!p&&!p.is_disabled&&(p.role==='admin'||p.lifetime_access===true||(p.access_expires_at&&new Date(p.access_expires_at).getTime()>Date.now()))}function joinedDays(p){if(!p?.created_at)return 0;return Math.max(0,Math.floor((Date.now()-new Date(p.created_at).getTime())/86400000))}function trialState(p){if(p?.role==='admin')return 'Admin';if(p?.lifetime_access)return 'Lifetime access';if(p?.is_disabled)return 'Disabled';if(!p?.access_expires_at||new Date(p.access_expires_at).getTime()<=Date.now())return 'Trial ended';return 'Free trial active'}function remainingDays(p){if(!p?.access_expires_at||p.lifetime_access)return 0;return Math.max(0,Math.ceil((new Date(p.access_expires_at).getTime()-Date.now())/86400000))}function dateLabel(v){return v?new Date(v).toLocaleString():'—'}function go(p){location.hash='#'+p}function app(html){$('#app').innerHTML=html}function notice(t,kind=''){return `<div class="notice ${kind}">${esc(t)}</div>`}function slug(s){return (s||'creator').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'creator'}function publicUrl(s){return location.href.split('#')[0]+'#/'+encodeURIComponent(s)}function err(e){return e?.message||String(e||'Unknown error')}function btn(label,onclick,cls=''){return `<button class="${cls}" onclick="${onclick}">${label}</button>`}
async function init(){try{const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me)await loadProfile();db.auth.onAuthStateChange((_ev,s)=>{me=s?.user||null;setTimeout(async()=>{profile=null;admin=false;if(me)await loadProfile();route()},0)});$('#signout').classList.toggle('hidden',!me);await loadSettings();await route()}catch(e){app(`<div class="hero"><h1>PRIVEXA couldn't connect</h1>${notice(err(e),'error')}<p>Check the Supabase project URL/key, internet connection and project API status.</p></div>`)}}
async function loadProfile(){if(!me)return;const {data,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error)console.warn(error);profile=data;admin=data?.role==='admin';$('#signout')?.classList.toggle('hidden',!me)}async function loadSettings(){const {data,error}=await db.from('site_settings').select('key,value');if(!error&&data)for(const r of data)settings[r.key]=r.value}
async function queryRows(table,cols='*',filters=[]){let q=db.from(table).select(cols);for(const [k,op,v] of filters)q=q[op](k,v);const {data,error}=await q.order('created_at',{ascending:false});if(error)throw error;return data||[]}
function fileUrl(row){if(row.storage_path){if(row.storage_bucket==='privexa-private'){return row.signed_url||''}return db.storage.from('privexa-public').getPublicUrl(row.storage_path).data.publicUrl}return row.url||''}
function linkMarkup(raw){let arr=[];try{arr=Array.isArray(raw)?raw:JSON.parse(raw||'[]')}catch{}return arr.filter(x=>x&&x.url).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label||'Open link')} ↗</a>`).join('')}
function contentCard(i,opts={}){const href=fileUrl(i);const links=linkMarkup(i.links_json);let locked=i.is_paid&&!(i.access_granted===true||opts.access_granted===true);return `<article class="item"><span class="tag">${esc(i.content_type||'Content')}${i.is_paid?' · PAID':''}</span><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p>${i.text_content?`<p>${esc(i.text_content)}</p>`:''}${i.is_paid?`<p class="price">${fmt(i.price)}</p>`:''}${!locked&&href?`<a class="filelink" href="${esc(href)}" target="_blank" rel="noopener">Open content ↗</a>`:''}${!locked&&links?`<div class="links">${links}</div>`:''}${locked?`<p class="muted">This content is locked.</p>${btn('Request access',`requestPayment('content','${i.id}')`,'primary')}`:''}${opts.owner?`<div class="links">${btn(i.is_published?'Unpublish':'Publish',opts.admin?`adminToggle('${i.id}',${!i.is_published})`:`toggleContent('${i.id}',${!i.is_published})`)}${btn('Edit',opts.admin?`adminEditContent('${i.id}')`:`editContent('${i.id}')`)}${btn('Delete',opts.admin?`adminDeleteContent('${i.id}')`:`deleteContent('${i.id}')`,'danger')}</div>`:''}</article>`}
function folderCard(f,opts={}){let locked=f.is_paid&&!f.access_granted;return `<article class="item"><span class="tag">FOLDER${f.is_paid?' · PAID':''}</span><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p>${f.is_paid?`<p class="price">${fmt(f.price)}</p>`:''}${locked?`${btn('Request access',`requestPayment('folder','${f.id}')`,'primary')}`:btn('Open folder',`openFolder('${f.id}')`)}${opts.owner?`<div class="links">${btn(f.is_published?'Unpublish':'Publish',opts.admin?`adminToggleFolder('${f.id}',${!f.is_published})`:`toggleFolder('${f.id}',${!f.is_published})`)}${btn('Edit',opts.admin?`adminEditFolder('${f.id}')`:`editFolder('${f.id}')`)}${btn('Delete',opts.admin?`adminDeleteFolder('${f.id}')`:`deleteFolder('${f.id}')`,'danger')}</div>`:''}</article>`}
async function explore(){try{const [fs,its]=await Promise.all([db.from('folders').select('*').eq('is_published',true).eq('is_admin_content',true).order('created_at',{ascending:false}),db.from('published_content').select('*').is('folder_id',null).eq('is_published',true).eq('is_admin_content',true).order('created_at',{ascending:false})]);if(fs.error)throw fs.error;if(its.error)throw its.error;app(`<section class="hero"><span class="tag">PREMIUM CONTENT PLATFORM</span><h1>Publish. Share.<br><span style="color:var(--purple)">PRIVEXA.</span></h1><p>One public link. Shared content across browsers and devices. Creator pages, file sharing, folders and paid access.</p><div class="row"><button class="primary" onclick="go('/register')">Create your space</button><button onclick="go('/login')">Sign in</button></div></section><div class="section"><h2>Official folders</h2></div><div class="grid">${fs.data?.length?fs.data.map(f=>folderCard(f)).join(''):'<div class="empty">No official folders published yet.</div>'}</div><div class="section"><h2>Official content</h2></div><div class="grid">${its.data?.length?its.data.map(i=>contentCard(i)).join(''):'<div class="empty">No official content published yet.</div>'}</div>`)}catch(e){app(`<div class="hero"><h1>Could not load shared content</h1>${notice(err(e),'error')}<p>Make sure you ran the complete <b>setup.sql</b> in the correct Supabase project and that the project API is available.</p><button onclick="explore()">Retry</button></div>`)} }
async function authPage(kind){app(`<div class="hero"><h1>${kind==='register'?'Create your account':'Sign in'}</h1><p>Accounts are authenticated by Supabase.</p></div><form class="panel" id="authform" style="max-width:560px">${kind==='register'?`<div class="field"><label>Display name</label><input id="name" required></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><button class="primary" style="width:100%;margin-top:8px">${kind==='register'?'Create account':'Sign in'}</button>${kind==='login'?`<p><button type="button" onclick="resetPassword()">Send password reset email</button></p>`:''}<p id="authmsg"></p></form>`);$('#authform').onsubmit=async e=>{e.preventDefault();const out=$('#authmsg');out.textContent='Please wait…';const email=$('#email').value.trim(),password=$('#password').value;let r;if(kind==='register'){r=await db.auth.signUp({email,password,options:{data:{display_name:$('#name').value.trim()}}});if(!r.error&&r.data.user){out.textContent=r.data.session?'Account created. Loading dashboard…':'Account created. Check your email to confirm, then sign in.';if(r.data.session)go('/dashboard')}}else{r=await db.auth.signInWithPassword({email,password});if(!r.error)go('/dashboard')}if(r.error)out.textContent=r.error.message};}
async function resetPassword(){const email=$('#email').value.trim();if(!email){$('#authmsg').textContent='Enter your email first.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]+'#/login'});$('#authmsg').textContent=error?error.message:'Password reset email sent if the account exists.'}
async function logout(){await db.auth.signOut();me=null;profile=null;admin=false;go('/')}
function shellDash(title,desc,body){app(`<div class="hero"><span class="tag">${admin?'ADMIN PANEL':'CREATOR DASHBOARD'}</span><h1>${esc(title)}</h1><p>${esc(desc||'')}</p></div><div class="tabs">${btn('Overview',"dashTab('overview')")}${btn('My content',"dashTab('content')")}${btn('Folders',"dashTab('folders')")}${btn('Payments',"dashTab('payments')")}${btn('Page settings',"dashTab('settings')")}${admin?btn('Admin tools',"go('/admin')"):''}${btn('Home',"go('/')")}</div>${body}`)}
async function dashboard(tab='overview'){if(!me){go('/login');return}await loadProfile();if(!profile){app(`<div class="hero"><h1>Profile not ready</h1>${notice('Check that setup.sql has been run. Sign out and sign in again after the database is ready.','error')}</div>`);return}if(!accessAllowed(profile)){app(`<div class="hero"><h1>Access inactive</h1><p>${profile.is_disabled?'Your account was disabled by the administrator.':'Your 3-day trial has expired or is not active.'}</p>${btn('Request lifetime access',"go('/access')",'primary')}${btn('Sign out','logout()')}</div>`);return}currentTab=tab;try{const [its,fs,pays]=await Promise.all([queryRows('content_items','*',[['owner_id','eq',me.id]]),queryRows('folders','*',[['owner_id','eq',me.id]]),queryRows('payment_requests','*',[['buyer_id','eq',me.id]])]);for(const i of its)if(i.storage_bucket==='privexa-private'&&i.storage_path){i.access_granted=true;const {data:u}=await db.storage.from('privexa-private').createSignedUrl(i.storage_path,300);if(u)i.signed_url=u.signedUrl}let body='';if(tab==='overview')body=`<div class="grid"><div class="panel"><div class="muted">Content items</div><div class="stat">${its.length}</div></div><div class="panel"><div class="muted">Folders</div><div class="stat">${fs.length}</div></div><div class="panel"><div class="muted">Payment requests</div><div class="stat">${pays.length}</div></div></div><div class="panel" style="margin-top:14px"><h2>Your public creator link</h2><p><a href="${esc(publicUrl(profile.slug))}" target="_blank">${esc(publicUrl(profile.slug))}</a></p><div class="row">${btn('Copy public link',`copyText('${esc(publicUrl(profile.slug))}')`,'primary')}${btn('Edit page settings',"dashTab('settings')")}</div><p class="small">Only your published content appears on this creator page. The main homepage is reserved for content published by PRIVEXA Admin.</p></div>`;
if(tab==='content')body=`<div class="two"><form class="panel" id="contentform"><h2>Add content</h2><input id="cid" type="hidden"><div class="field"><label>Title</label><input id="ctitle" required></div><div class="field"><label>Description</label><textarea id="cdesc"></textarea></div><div class="formgrid"><div class="field"><label>Content type</label><select id="ctype"><option>PDF / document</option><option>Image</option><option>Video</option><option>Website link</option><option>Text / portfolio</option><option>Other file</option></select></div><div class="field"><label>Folder</label><select id="cfolder"><option value="">No folder</option>${fs.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select></div></div><div class="field"><label>Upload a file (public/free files only)</label><input id="cfile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov,.m4v,.mp3,.wav,application/pdf,video/*,image/*,audio/*,application/zip"><p class="small">Supported uploads: PDF/documents, videos (MP4/WebM/MOV), images and audio. Maximum 50 MB per file. Paid uploads are stored privately.</p></div><div class="field"><label>External URL</label><input id="curl" type="url" placeholder="https://..."></div><div class="field"><label>Text / portfolio description</label><textarea id="ctext"></textarea></div><div class="field"><label>Additional links (one per line: Label | https://example.com)</label><textarea id="clinks" placeholder="Download PDF | https://...\nWatch video | https://..."></textarea></div><div class="check"><input id="cpaid" type="checkbox" onchange="$('#cpricebox').classList.toggle('hidden',!this.checked)"><label for="cpaid">Lock this content behind payment</label></div><div id="cpricebox" class="hidden"><div class="field"><label>Price (INR)</label><input id="cprice" type="number" min="1" step="0.01" value="99"></div><div class="field"><label>Payment UPI ID for this content (optional; falls back to your profile UPI)</label><input id="cupipayment" placeholder="creator@upi"></div><div class="field"><label>Payee name for this content (optional)</label><input id="cupinamepayment" placeholder="Payee name"></div><div class="field"><label>QR image URL for this content (optional)</label><input id="cuqrpayment" placeholder="https://..."></div><div class="field"><label>Upload QR image for this content (optional)</label><input id="cuqrfilepayment" type="file" accept="image/png,image/jpeg,image/webp"></div><p class="small">These payment details are separate from lifetime access payment details.</p></div><div class="check"><input id="cpub" type="checkbox" checked><label for="cpub">Publish on my creator page</label></div><button class="primary">Save content</button><p id="cmsg"></p></form><div><div class="panel"><h2>My content</h2><p class="small">Publish, edit or remove your content. Admin homepage remains separate.</p></div><div class="grid" style="margin-top:12px">${its.map(i=>contentCard(i,{owner:true,admin:true})).join('')||'<div class="empty">No content yet.</div>'}</div></div></div>`;
if(tab==='folders')body=`<div class="two"><form class="panel" id="folderform"><h2>Create folder</h2><input id="fid" type="hidden"><div class="field"><label>Folder name</label><input id="ftitle" required></div><div class="field"><label>Description</label><textarea id="fdesc"></textarea></div><div class="check"><input id="fpaid" type="checkbox" onchange="$('#fpricebox').classList.toggle('hidden',!this.checked)"><label for="fpaid">Lock folder behind payment</label></div><div id="fpricebox" class="hidden"><div class="field"><label>Price (INR)</label><input id="fprice" type="number" min="1" value="199"></div><div class="field"><label>Payment UPI ID for this folder (optional; falls back to your profile UPI)</label><input id="fupi" placeholder="creator@upi"></div><div class="field"><label>Payee name for this folder</label><input id="funame" placeholder="Payee name"></div><div class="field"><label>QR image URL for this folder (optional)</label><input id="fuqr" placeholder="https://..."></div><div class="field"><label>Upload QR image for this folder (optional)</label><input id="fuqrfile" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div class="check"><input id="fpub" type="checkbox" checked><label for="fpub">Publish on creator page</label></div><button class="primary">Save folder</button><p id="fmsg"></p></form><div class="grid">${fs.map(f=>folderCard(f,{owner:true,admin:true})).join('')||'<div class="empty">No folders yet.</div>'}</div></div>`;

if(tab==='settings')body=`<form class="panel" id="profileform" style="max-width:700px"><h2>Public page settings</h2><div class="field"><label>Display name</label><input id="pname" value="${esc(profile.display_name||'')}"></div><div class="field"><label>Unique page slug (a-z, 0-9, hyphens)</label><input id="pslug" value="${esc(profile.slug||'')}"></div><div class="field"><label>Bio / introduction</label><textarea id="pbio">${esc(profile.bio||'')}</textarea></div><div class="field"><label>WhatsApp contact number (international format, digits only)</label><input id="pwa" value="${esc(profile.whatsapp||'')}" placeholder="919876543210"></div><hr><h3>Payments for your locked content</h3><p class="small">These payment details are shown to buyers on your creator page only. They are separate from PRIVEXA Admin's UPI settings.</p><div class="field"><label>Your UPI ID</label><input id="pupi" value="${esc(profile.upi_id||'')}" placeholder="yourname@upi"></div><div class="field"><label>UPI payee name</label><input id="pupiname" value="${esc(profile.upi_name||profile.display_name||'')}" placeholder="Your name"></div><div class="field"><label>QR image URL (optional)</label><input id="puqrlink" value="${esc(profile.upi_qr_url||'')}" placeholder="https://..."></div><div class="field"><label>Upload your UPI QR image (PNG/JPG, max 5 MB)</label><input id="puqrfile" type="file" accept="image/png,image/jpeg,image/webp"></div>${profile.upi_qr_url?`<p><img class="preview" src="${esc(profile.upi_qr_url)}" alt="Your UPI QR code"></p>`:''}<button class="primary">Save settings</button><p id="pmsg"></p></form>`;

async function uploadOptionalQr(inputId, fallbackUrl, prefix){
 const file=document.getElementById(inputId)?.files?.[0];
 if(!file)return fallbackUrl||null;
 if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw new Error('QR image must be PNG/JPG/WebP and no larger than 5 MB.');
 const path=me.id+'/'+prefix+'-'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
 const {error}=await db.storage.from('privexa-public').upload(path,file,{contentType:file.type,upsert:false});
 if(error)throw new Error('QR upload failed: '+error.message);
 return db.storage.from('privexa-public').getPublicUrl(path).data.publicUrl;
}

async function openFolder(id){try{const {data:f,error}=await db.from('folders').select('*').eq('id',id).single();if(error)throw error;const {data:rows,error:e}=await db.from('published_content').select('*').eq('folder_id',id).eq('is_published',true).order('created_at',{ascending:false});if(e)throw e;let access=false;if(f.is_paid&&me){const {data:p}=await db.from('payment_requests').select('id').eq('buyer_id',me.id).eq('target_id',id).eq('target_type','folder').eq('status','approved').maybeSingle();access=!!p}if(f.is_paid&&!access){app(`<div class="hero"><h1>${esc(f.title)}</h1><p>${esc(f.description||'')}</p><p class="price">${fmt(f.price)}</p>${btn('Request access',`requestPayment('folder','${id}')`,'primary')}</div>`);return}for(const i of (rows||[])){if(i.is_paid&&me){const {data:a}=await db.from('payment_requests').select('id').eq('buyer_id',me.id).eq('target_id',i.id).eq('target_type','content').eq('status','approved').maybeSingle();i.access_granted=!!a;if(i.storage_bucket==='privexa-private'&&i.storage_path&&(!i.is_paid||i.access_granted)){const {data:u}=await db.storage.from('privexa-private').createSignedUrl(i.storage_path,300);if(u)i.signed_url=u.signedUrl}}}app(`<div class="hero">${btn('← Back',"history.back()")}<h1>${esc(f.title)}</h1><p>${esc(f.description||'')}</p></div><div class="grid">${rows?.length?rows.map(i=>contentCard({...i,access_granted:!i.is_paid})).join(''):'<div class="empty">No published content in this folder.</div>'}</div>`)}catch(e){app(notice(err(e),'error'))}}
async function requestPayment(type,id){if(!me){alert('Please sign in before requesting paid access.');go('/login');return}const table=type==='folder'?'folders':'published_content';const {data:item,error}=await db.from(table).select('*').eq('id',id).single();if(error){alert(error.message);return}const sellerId=item.owner_id;if(!sellerId){alert('Could not identify this content owner.');return}const {data:seller,error:sellerErr}=await db.from('profiles').select('id,display_name,upi_id,upi_name,upi_qr_url').eq('id',sellerId).single();if(sellerErr){alert('Could not load the creator payment details: '+sellerErr.message);return}const upi=item?.payment_upi_id||seller?.upi_id||settings.upi_id||'';const payee=item?.payment_upi_name||seller?.upi_name||seller?.display_name||settings.upi_name||'Content creator';const qr=item?.payment_qr_url||seller?.upi_qr_url||settings.upi_qr_url||'';const targetTitle=item.title;app(`<div class="hero"><h1>Request paid access</h1><p>${esc(targetTitle)}</p><p class="price">${fmt(item.price)}</p><p>Content owner: ${esc(seller?.display_name||'Creator')}</p></div><div class="two"><div class="panel"><h2>Pay the content owner</h2>${upi?`<p>UPI ID: <b>${esc(upi)}</b></p><p>Payee: ${esc(payee)}</p>${qr?`<img class="preview" src="${esc(qr)}" alt="Payment QR code"><p class="small">Scan this QR code using your UPI app.</p>`:''}<a class="btn primary" href="${esc('upi://pay?pa='+encodeURIComponent(upi)+'&pn='+encodeURIComponent(payee)+'&am='+encodeURIComponent(item.price)+'&cu=INR')}">Open UPI app</a>`:'<p>This creator has not configured a UPI ID or QR code yet. Contact the creator before paying.</p>'}<p class="small">Pay the creator directly. Enter the transaction reference and upload your screenshot. The creator must approve access.</p></div><form class="panel" id="payform"><div class="field"><label>UPI transaction reference / UTR</label><input id="utr" required></div><div class="field"><label>Payment screenshot</label><input id="proof" type="file" accept="image/*" required></div><button class="primary">Submit for creator approval</button><p id="paymsg"></p></form></div>`);$('#payform').onsubmit=async e=>{e.preventDefault();const msg=$('#paymsg');msg.textContent='Uploading proof…';const file=$('#proof').files[0];if(!file||file.size>5*1024*1024){msg.textContent='Choose a payment screenshot up to 5 MB.';return}const path=me.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from('privexa-private').upload(path,file,{contentType:file.type||'application/octet-stream'});if(up.error){msg.textContent=up.error.message;return}const row={buyer_id:me.id,seller_id:sellerId,target_type:type,target_id:id,item_title:targetTitle,amount:Number(item.price||0),transaction_ref:$('#utr').value.trim(),proof_path:path,status:'pending'};const {error}=await db.from('payment_requests').insert(row);msg.textContent=error?'Could not submit request: '+error.message:'Request submitted to the creator. Access remains locked until the creator approves.'}}

async function saveLifetimePrice(){if(!admin)return;const el=$('#lifetimeprice');const price=Number(el?.value);if(!Number.isFinite(price)||price<1){alert('Enter a lifetime price of at least ₹1.');return}const {error}=await db.from('site_settings').upsert({key:'lifetime_price',value:String(price),updated_by:me.id},{onConflict:'key'});if(error){alert(error.message);return}settings.lifetime_price=String(price);alert('Lifetime access price saved.');adminPage('customers')}
async function reviewAccess(id,status){const {data:r,error:readErr}=await db.from('access_requests').select('buyer_id').eq('id',id).single();if(readErr){alert(readErr.message);return}const {error}=await db.from('access_requests').update({status,reviewed_by:me.id,reviewed_at:new Date().toISOString(),admin_note:status==='approved'?'Lifetime access approved':'Rejected'}).eq('id',id);if(error){alert(error.message);return}if(status==='approved'){const {error:e}=await db.from('profiles').update({lifetime_access:true,is_disabled:false,access_expires_at:null}).eq('id',r.buyer_id);if(e){alert(e.message);return}}adminPage('access')}
async function viewAccessProof(id){const {data:r,error}=await db.from('access_requests').select('proof_path').eq('id',id).single();if(error){alert(error.message);return}const {data,error:e}=await db.storage.from('privexa-private').createSignedUrl(r.proof_path,300);if(e){alert(e.message);return}window.open(data.signedUrl,'_blank','noopener')}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Copied')}catch{prompt('Copy this link:',t)}}
async function adminPage(tab='overview'){if(!me){go('/login');return}await loadProfile();if(!admin){app(`<div class="hero"><h1>Admin access required</h1><p>This account is not assigned the admin role in Supabase.</p>${notice('Register/sign in with your admin email, then run the admin promotion SQL in README.txt.','error')}</div>`);return}currentTab=tab;try{const [its,fs,pays,users,accessReqs]=await Promise.all([queryRows('content_items'),queryRows('folders'),queryRows('payment_requests'),queryRows('profiles'),queryRows('access_requests')]);for(const i of its)if(i.storage_bucket==='privexa-private'&&i.storage_path){i.access_granted=true;const {data:u}=await db.storage.from('privexa-private').createSignedUrl(i.storage_path,300);if(u)i.signed_url=u.signedUrl}let body='';if(tab==='overview')body=`<div class="grid"><div class="panel"><div class="muted">Customers</div><div class="stat">${users.filter(x=>x.role!=='admin').length}</div></div><div class="panel"><div class="muted">Content items</div><div class="stat">${its.length}</div></div><div class="panel"><div class="muted">Folders</div><div class="stat">${fs.length}</div></div><div class="panel"><div class="muted">Pending payments</div><div class="stat">${pays.filter(p=>p.status==='pending').length}</div></div><div class="panel"><div class="muted">Lifetime access price</div><div class="stat">${fmt(settings.lifetime_price||499)}</div></div></div><div class="panel" style="margin-top:14px"><h2>Admin controls</h2><p>Publish official content to the main homepage, manage customer pages, set UPI details, and review payment requests.</p><div class="row">${btn('Manage customers',"adminPage('customers')")}${btn('Manage content',"adminPage('content')")}${btn('Payment approvals',"adminPage('payments')")}${btn('Website access',"adminPage('access')")}${btn('UPI settings',"adminPage('settings')")}</div></div>`;
if(tab==='content')body=`<div class="two"><form class="panel" id="admincontentform"><h2>Publish official content</h2><input id="acid" type="hidden"><div class="field"><label>Title</label><input id="actitle" required></div><div class="field"><label>Description</label><textarea id="acdesc"></textarea></div><div class="formgrid"><div class="field"><label>Type</label><select id="actype"><option>PDF / document</option><option>Image</option><option>Video</option><option>Website link</option><option>Text / portfolio</option><option>Other file</option></select></div><div class="field"><label>Folder</label><select id="acfolder"><option value="">No folder</option>${fs.filter(f=>f.is_admin_content).map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select></div></div><div class="field"><label>Upload file</label><input id="acfile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov,.m4v,.mp3,.wav,application/pdf,video/*,image/*,audio/*,application/zip"><p class="small">Supported uploads: PDF/documents, videos (MP4/WebM/MOV), images and audio. Maximum 50 MB per file.</p></div><div class="field"><label>External URL</label><input id="acurl" type="url"></div><div class="field"><label>Text content</label><textarea id="actext"></textarea></div><div class="field"><label>Additional links (Label | URL, one per line)</label><textarea id="aclinks"></textarea></div><div class="check"><input id="acpaid" type="checkbox" onchange="$('#acpricebox').classList.toggle('hidden',!this.checked)"><label for="acpaid">Lock behind payment</label></div><div id="acpricebox" class="hidden"><div class="field"><label>Price (INR)</label><input id="acprice" type="number" min="1" value="99"></div><div class="field"><label>Payment UPI ID for this content (optional; falls back to admin UPI)</label><input id="acupi" placeholder="admin@upi"></div><div class="field"><label>Payee name for this content</label><input id="acupiname" placeholder="Payee name"></div><div class="field"><label>QR image URL for this content (optional)</label><input id="acuqr" placeholder="https://..."></div><div class="field"><label>Upload QR image for this content (optional)</label><input id="acuqrfile" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div class="check"><input id="acpub" type="checkbox" checked><label for="acpub">Publish on main homepage</label></div><button class="primary">Save official content</button><p id="acmsg"></p></form><form class="panel" id="adminfolderform"><h2>Create official folder</h2><div class="field"><label>Folder title</label><input id="aftitle" required></div><div class="field"><label>Description</label><textarea id="afdesc"></textarea></div><div class="check"><input id="afpaid" type="checkbox" onchange="$('#afpricebox').classList.toggle('hidden',!this.checked)"><label for="afpaid">Paid folder</label></div><div id="afpricebox" class="hidden"><div class="field"><label>Price (INR)</label><input id="afprice" type="number" min="1" value="199"></div><div class="field"><label>Payment UPI ID for this folder (optional; falls back to admin UPI)</label><input id="afupi" placeholder="admin@upi"></div><div class="field"><label>Payee name for this folder</label><input id="afupiname" placeholder="Payee name"></div><div class="field"><label>QR image URL for this folder (optional)</label><input id="afuqr" placeholder="https://..."></div><div class="field"><label>Upload QR image for this folder (optional)</label><input id="afuqrfile" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div class="check"><input id="afpub" type="checkbox" checked><label for="afpub">Publish on homepage</label></div><button class="primary">Save official folder</button><p id="afmsg"></p></form></div><div class="section"><h2>All content</h2></div><div class="grid">${its.map(i=>contentCard(i,{owner:true,admin:true})).join('')||'<div class="empty">No content yet.</div>'}</div><div class="section"><h2>All folders</h2></div><div class="grid">${fs.map(f=>folderCard(f,{owner:true,admin:true})).join('')||'<div class="empty">No folders yet.</div>'}</div>`;
if(tab==='customers')body=`<div class="panel"><h2>Customer account management</h2><p>Track registration date, total days joined, trial end date, remaining trial days and lifetime-access status. Use End trial to expire access immediately; customers can then submit payment proof for lifetime access.</p><div class="field"><label>Lifetime access price (INR)</label><div class="row"><input id="lifetimeprice" type="number" min="1" step="1" value="${esc(settings.lifetime_price||'499')}" style="max-width:220px"><button class="primary" onclick="saveLifetimePrice()">Save lifetime price</button></div><p class="small">This price is displayed on the lifetime-access payment page. Verify UPI payments manually.</p></div>${users.map(u=>{const state=trialState(u);return `<div class="listrow"><div><h3>${esc(u.display_name||'Creator')} <span class="tag">${esc(u.role)}</span> <span class="tag">${esc(state)}</span></h3><p>Joined: <b>${esc(dateLabel(u.created_at))}</b> · Days joined: <b>${joinedDays(u)}</b></p><p>Trial ends: <b>${esc(dateLabel(u.access_expires_at))}</b> · Days remaining: <b>${u.lifetime_access?'∞':remainingDays(u)}</b></p><p>Page: <a href="${esc(publicUrl(u.slug))}" target="_blank">${esc(u.slug)}</a></p><p class="small">${esc(u.id)}</p></div><div class="row">${u.role==='admin'?'':btn('Extend 3 days',`setAccess('${u.id}','3days')`)}${u.role==='admin'?'':btn('End trial now',`setAccess('${u.id}','expire')`,'danger')}${u.role==='admin'?'':btn(u.lifetime_access?'Lifetime ✓':'Grant lifetime',`setAccess('${u.id}','lifetime')`,'primary')}${u.role==='admin'?'':btn(u.is_disabled?'Enable account':'Disable account',`setAccess('${u.id}','toggle')`,'danger')}${u.role==='admin'?'':btn('Make admin',`setRole('${u.id}','admin')`)}${u.role==='admin'?btn('Make customer',`setRole('${u.id}','customer')`,'danger'):''}</div></div>`}).join('')||'<div class="empty">No profiles.</div>'}</div>`;
if(tab==='access')body=`<div class="panel"><h2>Lifetime access requests</h2><p>Verify payment independently before approving.</p>${accessReqs.map(r=>`<div class="listrow"><div><b>${esc(r.status)}</b><p>Buyer: ${esc(r.buyer_id)} · UTR: ${esc(r.transaction_ref)}</p>${btn('View proof',`viewAccessProof('${r.id}')`)} </div><div>${r.status==='pending'?btn('Approve lifetime',`reviewAccess('${r.id}','approved')`,'primary'):''}${r.status==='pending'?btn('Reject',`reviewAccess('${r.id}','rejected')`,'danger'):''}</div></div>`).join('')||'<p>No requests.</p>'}</div>`;
if(tab==='payments')body=`<div class="panel"><h2>Payment requests</h2><p>Review transaction references and screenshots. Approving a request grants access only to its target item/folder.</p>${pays.map(p=>`<div class="listrow"><div><h3>${esc(p.item_title||'Paid access')} <span class="tag">${esc(p.status)}</span></h3><p>Amount: ${fmt(p.amount)} · Buyer: ${esc(p.buyer_id)}</p><p>Type: ${esc(p.target_type)} · Target: ${esc(p.target_id)}</p><p>UPI reference: <b>${esc(p.transaction_ref||'—')}</b></p>${p.proof_path?btn('View payment screenshot',`viewProof('${p.id}')`):''}${p.admin_note?`<p>${esc(p.admin_note)}</p>`:''}</div><div class="row">${p.status==='pending'?btn('Approve',`reviewPayment('${p.id}','approved')`,'primary'):''}${p.status==='pending'?btn('Reject',`reviewPayment('${p.id}','rejected')`,'danger'):''}</div></div>`).join('')||'<div class="empty">No payment requests yet.</div>'}</div>`;
if(tab==='settings')body=`<form class="panel" id="settingsform" style="max-width:650px"><h2>Payment settings</h2><div class="field"><label>UPI ID</label><input id="upiid" value="${esc(settings.upi_id||'')}" placeholder="yourname@upi"></div><div class="field"><label>Payee name</label><input id="upiname" value="${esc(settings.upi_name||'PRIVEXA')}"></div><div class="field"><label>UPI QR image URL (optional)</label><input id="upiqr" value="${esc(settings.upi_qr_url||'')}" placeholder="https://..."></div><div class="field"><label>Upload UPI QR image (PNG/JPG, max 5 MB)</label><input id="upiqrfile" type="file" accept="image/*"></div><button class="primary">Save payment settings</button><p id="setmsg"></p>${settings.upi_qr_url?`<p><img class="preview" src="${esc(settings.upi_qr_url)}" alt="UPI QR"></p>`:''}</form><div class="panel" style="margin-top:14px"><h2>Security reminder</h2><p>Keep RLS enabled. Never paste service-role keys into this website. UPI payment requests are manually verified by the admin; this app does not verify payments directly with a bank.</p></div>`;
shellDash('Admin dashboard','Manage official publishing, customer content, access requests and payment settings.',body);
if(tab==='content')wireAdminForms();if(tab==='settings')wireSettingsForm();}catch(e){app(`<div class="hero"><h1>Admin panel error</h1>${notice(err(e),'error')}</div>`)} }
function adminTab(t){adminPage(t)}
function wireAdminForms(){ const adminFile=$('#acfile');adminFile?.addEventListener('change',()=>{const f=adminFile.files?.[0];if(!f)return;const t=$('#actype');if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))t.value='PDF / document';else if(f.type.startsWith('video/')||/\.(mp4|webm|mov|m4v)$/i.test(f.name))t.value='Video';else if(f.type.startsWith('image/'))t.value='Image';});$('#admincontentform').onsubmit=async e=>{e.preventDefault();const m=$('#acmsg');m.textContent='Saving…';const paid=$('#acpaid').checked,folderId=$('#acfolder').value||null;let parentPaid=false;if(folderId){const {data:parent}=await db.from('folders').select('is_paid').eq('id',folderId).maybeSingle();parentPaid=!!parent?.is_paid}let storage_path=null;const file=$('#acfile').files[0];if(file){const bucket=(paid||parentPaid)?'privexa-private':'privexa-public';const path=me.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from(bucket).upload(path,file);if(up.error){m.textContent=up.error.message;return}storage_path=path}const storage_bucket=file?((paid||parentPaid)?'privexa-private':'privexa-public'):null;const qrUrl=paid?await uploadOptionalQr('acuqrfile',$('#acuqr')?.value.trim(),'admin-content-qr'):($('#acuqr')?.value.trim()||null);const row={owner_id:me.id,folder_id:folderId,title:$('#actitle').value.trim(),description:$('#acdesc').value.trim(),content_type:$('#actype').value,url:$('#acurl').value.trim()||null,text_content:$('#actext').value.trim()||null,links_json:parseLinks($('#aclinks').value),storage_path,storage_bucket:storage_bucket||'privexa-public',is_paid:paid,price:paid?Number($('#acprice').value||0):0,payment_upi_id:$('#acupi')?.value.trim()||null,payment_upi_name:$('#acupiname')?.value.trim()||null,payment_qr_url:qrUrl,is_published:$('#acpub').checked,is_admin_content:true};const id=$('#acid').value;if(id){const {data:old,error:oldErr}=await db.from('content_items').select('owner_id,is_admin_content,storage_path,storage_bucket').eq('id',id).single();if(oldErr){m.textContent=oldErr.message;return}row.owner_id=old.owner_id;row.is_admin_content=old.is_admin_content;if(!file){row.storage_path=old.storage_path;row.storage_bucket=old.storage_bucket}}const {error}=id?await db.from('content_items').update(row).eq('id',id):await db.from('content_items').insert(row);if(error){m.textContent=error.message;return}adminPage('content')};$('#adminfolderform').onsubmit=async e=>{e.preventDefault();const paid=$('#afpaid').checked;let qrUrl=null;try{qrUrl=paid?await uploadOptionalQr('afuqrfile',$('#afuqr')?.value.trim(),'admin-folder-qr'):($('#afuqr')?.value.trim()||null)}catch(ex){$('#afmsg').textContent=err(ex);return}const {error}=await db.from('folders').insert({owner_id:me.id,title:$('#aftitle').value.trim(),description:$('#afdesc').value.trim(),is_paid:paid,price:paid?Number($('#afprice').value||0):0,payment_upi_id:$('#afupi')?.value.trim()||null,payment_upi_name:$('#afupiname')?.value.trim()||null,payment_qr_url:qrUrl,is_published:$('#afpub').checked,is_admin_content:true});$('#afmsg').textContent=error?error.message:'Saved';if(!error)adminPage('content')};}
async function wireSettingsForm(){$('#settingsform').onsubmit=async e=>{e.preventDefault();const msg=$('#setmsg');msg.textContent='Saving…';let qr=$('#upiqr').value.trim();const file=$('#upiqrfile')?.files?.[0];if(file){if(!file.type.startsWith('image/')||file.size>5*1024*1024){msg.textContent='Choose an image up to 5 MB.';return}const path=me.id+'/upi-qr-'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:upErr}=await db.storage.from('privexa-public').upload(path,file);if(upErr){msg.textContent=upErr.message;return}qr=db.storage.from('privexa-public').getPublicUrl(path).data.publicUrl}const values={upi_id:$('#upiid').value.trim(),upi_name:$('#upiname').value.trim(),upi_qr_url:qr};for(const [key,value] of Object.entries(values)){const {error}=await db.from('site_settings').upsert({key,value,updated_by:me.id},{onConflict:'key'});if(error){msg.textContent=error.message;return}}settings={...settings,...values};msg.textContent='Saved.';adminPage('settings')}}
async function setRole(id,role){if(!confirm(`Change this user's role to ${role}?`))return;const {error}=await db.rpc('admin_set_user_role',{target_user:id,new_role:role});if(error)alert(error.message);else adminPage('customers')}
async function reviewPayment(id,status){const note=status==='approved'?'Access approved by admin.':'Payment not approved. Contact admin if you believe this is an error.';const {error}=await db.from('payment_requests').update({status,admin_note:note,reviewed_by:me.id,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else adminPage('payments')}
async function viewProof(id){const {data:p,error}=await db.from('payment_requests').select('proof_path').eq('id',id).single();if(error){alert(error.message);return}const {data,error:e}=await db.storage.from('privexa-private').createSignedUrl(p.proof_path,300);if(e){alert(e.message);return}window.open(data.signedUrl,'_blank','noopener')}
async function adminToggle(id,v){const {error}=await db.from('content_items').update({is_published:v}).eq('id',id);if(error)alert(error.message);else adminPage('content')}async function adminDeleteContent(id){if(!confirm('Delete this content?'))return;const {error}=await db.from('content_items').delete().eq('id',id);if(error)alert(error.message);else adminPage('content')}async function adminToggleFolder(id,v){const {error}=await db.from('folders').update({is_published:v}).eq('id',id);if(error)alert(error.message);else adminPage('content')}async function adminDeleteFolder(id){if(!confirm('Delete this folder?'))return;const {error}=await db.from('folders').delete().eq('id',id);if(error)alert(error.message);else adminPage('content')}async function adminEditContent(id){const {data,error}=await db.from('content_items').select('*').eq('id',id).single();if(error){alert(error.message);return}adminPage('content');setTimeout(()=>{if(!$('#admincontentform'))return;$('#acid').value=data.id;$('#actitle').value=data.title;$('#acdesc').value=data.description||'';$('#actype').value=data.content_type||'Other file';$('#acfolder').value=data.folder_id||'';$('#acurl').value=data.url||'';$('#actext').value=data.text_content||'';$('#aclinks').value=(Array.isArray(data.links_json)?data.links_json:[]).map(x=>`${x.label} | ${x.url}`).join('\n');$('#acpaid').checked=!!data.is_paid;$('#acpricebox').classList.toggle('hidden',!data.is_paid);$('#acprice').value=data.price||99;$('#acpub').checked=!!data.is_published},250)}async function adminEditFolder(id){const {data,error}=await db.from('folders').select('*').eq('id',id).single();if(error){alert(error.message);return}const title=prompt('Folder title',data.title);if(title===null)return;const description=prompt('Folder description',data.description||'');if(description===null)return;const {error:e}=await db.from('folders').update({title,description}).eq('id',id);if(e)alert(e.message);else adminPage('content')}
async function route(){const p=decodeURIComponent((location.hash.slice(1)||'/')).split('/').filter(Boolean);if(!p.length)return explore();if(p[0]==='login')return authPage('login');if(p[0]==='register')return authPage('register');if(p[0]==='dashboard')return dashboard();if(p[0]==='admin')return adminPage(p[1]||'overview');if(p[0]==='payment')return requestPayment(p[1],p[2]);if(p[0]==='access')return accessRequestPage();return publicPage(p[0])}
window.addEventListener('hashchange',route);init();
</script></body></html>
