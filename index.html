<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIVEXA — Shared Publishing</title><style>
:root{--bg:#090b12;--p:#121624;--p2:#1a2030;--line:#2a3044;--t:#f5f6ff;--m:#a9b1c7;--purple:#b6a0ff;--cyan:#75e6ef;--green:#8ee6b2;--red:#ff879a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#28204b 0,transparent 32%),var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--p2);color:var(--t);cursor:pointer}button:hover{border-color:var(--purple)}.primary{background:var(--purple);color:#171326;font-weight:800}.wrap{max-width:1100px;padding:18px;margin:auto}.top,.row,.section{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top{border-bottom:1px solid var(--line);padding:10px 0 18px}.logo{font-size:25px;font-weight:950;letter-spacing:3px}.logo span{color:var(--purple)}nav{display:flex;gap:7px;flex-wrap:wrap}.hero{padding:30px 0 18px}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}.muted,p{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.panel,.item{background:linear-gradient(145deg,var(--p),#0e1119);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.item h3{overflow-wrap:anywhere;margin:10px 0 5px}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--m)}label{display:block;color:var(--m);font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid var(--line);background:#0c1019;color:var(--t);border-radius:9px;padding:11px}textarea{min-height:80px}.section{margin:24px 0 12px}.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--m)}a{color:var(--cyan);overflow-wrap:anywhere}.notice{padding:12px;border:1px solid #494064;background:#171527;border-radius:12px;margin:12px 0}.small{font-size:12px}.hidden{display:none!important}.footer{border-top:1px solid var(--line);padding:20px 0;margin-top:35px;color:var(--m);font-size:12px}
</style></head><body><div class="wrap"><header class="top"><div class="logo">PRIV<span>EXA</span></div><nav><button onclick="location.hash='#/'">Explore</button><button onclick="location.hash='#/login'">Login</button><button class="primary" onclick="location.hash='#/register'">Create account</button><button onclick="location.hash='#/admin'">Admin</button><button id="signout" class="hidden" onclick="logout()">Sign out</button></nav></header><main id="app"><div class="notice">Connecting to PRIVEXA…</div></main><div class="footer">PRIVEXA · Shared cloud content · Keep your Supabase policies enabled.</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Public client key only. Never place a service-role key in browser code.
const SUPABASE_URL='https://qqpiypgxpavwpprpjxkd.supabase.co';
const SUPABASE_KEY='sb_publishable_OoVilLB7zgKMC4hb2C_kcQ_ZOcszdmE';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,profile=null,items=[],folders=[],isAdmin=false;
function app(s){$('#app').innerHTML=s}function msg(e){return esc(e?.message||e||'Unknown error')}function slug(s){return (s||'creator').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'creator'}function publicUrl(s){return location.href.split('#')[0]+'#/'+encodeURIComponent(s)}
async function init(){const {data:{session}}=await db.auth.getSession();me=session?.user||null;if(me)await loadProfile();window.addEventListener('hashchange',route);db.auth.onAuthStateChange(async(_e,s)=>{me=s?.user||null;profile=null;if(me)await loadProfile();route()});await route()}
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error)console.error(error);profile=data;isAdmin=data?.role==='admin';$('#signout').classList.toggle('hidden',!me)}
async function getPublicItems(ownerId=null){let q=db.from('content_items').select('id,owner_id,title,description,content_type,url,text_content,storage_path,is_published,is_admin_content,created_at').eq('is_published',true).order('created_at',{ascending:false});if(ownerId)q=q.eq('owner_id',ownerId);else q=q.eq('is_admin_content',true);const {data,error}=await q;if(error)throw error;return data||[]}
async function getPublicFolders(ownerId=null){let q=db.from('folders').select('id,owner_id,title,description,is_published,is_admin_content,created_at').eq('is_published',true).order('created_at',{ascending:false});if(ownerId)q=q.eq('owner_id',ownerId);else q=q.eq('is_admin_content',true);const {data,error}=await q;if(error)throw error;return data||[]}
function itemCard(i){let href=i.url||'';if(i.storage_path){const {data}=db.storage.from('privexa-files').getPublicUrl(i.storage_path);href=data.publicUrl}return `<article class="item"><span class="tag">${esc(i.content_type||'Content')}</span><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p>${i.text_content?`<p>${esc(i.text_content)}</p>`:''}${href?`<a href="${esc(href)}" target="_blank" rel="noopener">Open content ↗</a>`:''}</article>`}
function folderCard(f){return `<article class="item"><span class="tag">FOLDER</span><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p><button onclick="openFolder('${f.id}')">Open folder</button></article>`}
async function explore(){try{const [fs,its]=await Promise.all([getPublicFolders(),getPublicItems()]);app(`<section class="hero"><span class="tag">SHARED PUBLIC WEBSITE</span><h1>Publish. Share.<br><span style="color:var(--purple)">PRIVEXA</span></h1><p>Official admin content is loaded from the shared Supabase database, so visitors using different browsers can see the same published content.</p><div class="row"><button class="primary" onclick="location.hash='#/register'">Create your space</button><button onclick="location.hash='#/login'">Sign in</button></div></section><div class="section"><h2>Published folders</h2></div><div class="grid">${fs.length?fs.map(folderCard).join(''):'<div class="empty">No folders published yet.</div>'}</div><div class="section"><h2>Public content</h2></div><div class="grid">${its.length?its.map(itemCard).join(''):'<div class="empty">No public content published yet.</div>'}</div>`)}catch(e){app(`<div class="hero"><h1>Database setup required</h1><p>PRIVEXA could not load shared content. Run the SQL setup file in your Supabase SQL Editor, then reload this page.</p><div class="notice">${msg(e)}</div></div>`)}}
async function authPage(kind){app(`<div class="hero"><h1>${kind==='register'?'Create your PRIVEXA account':'Sign in'}</h1><p>Accounts use Supabase Authentication, not browser-local passwords.</p></div><form class="panel" id="authform" style="max-width:520px">${kind==='register'?'<label>Display name</label><input id="name" required>':''}<label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="6" required><button class="primary" style="margin-top:14px;width:100%">${kind==='register'?'Create account':'Sign in'}</button><p id="err"></p></form>`);$('#authform').onsubmit=async e=>{e.preventDefault();$('#err').textContent='Please wait…';const email=$('#email').value.trim(),password=$('#password').value;let r;if(kind==='register'){r=await db.auth.signUp({email,password,options:{data:{display_name:$('#name').value.trim()}}});if(!r.error&&r.data.user){const n=$('#name').value.trim();const {error}=await db.from('profiles').upsert({id:r.data.user.id,display_name:n,slug:slug(n)+'-'+r.data.user.id.slice(0,5),bio:''});if(error)r.error=error;if(!r.error&&!r.data.session)$('#err').textContent='Check your email to confirm your account, then sign in.'}}else r=await db.auth.signInWithPassword({email,password});if(r.error)$('#err').textContent=r.error.message;else if(kind==='login'||r.data.session)location.hash='#/dashboard'} }
async function dashboard(){if(!me){location.hash='#/login';return}await loadProfile();if(!profile){app('<div class="notice">Profile is not ready yet. Sign out and sign in again, or check the SQL setup.</div>');return}const {data:mine,error}=await db.from('content_items').select('*').eq('owner_id',me.id).order('created_at',{ascending:false});if(error){app(`<div class="notice">${msg(error)}</div>`);return}app(`<div class="hero"><span class="tag">CUSTOMER DASHBOARD</span><h1>Hello, ${esc(profile.display_name||me.email)}</h1><p>Your published content is stored online and can be seen from your public page.</p></div><div class="panel"><b>Your public link</b><p><a href="${esc(publicUrl(profile.slug))}" target="_blank">${esc(publicUrl(profile.slug))}</a></p><button onclick="navigator.clipboard.writeText(publicUrl(profile.slug))">Copy link</button></div><div class="section"><h2>Add content</h2></div><form class="panel" id="contentform"><label>Title</label><input id="title" required><label>Description</label><textarea id="description"></textarea><label>Type</label><select id="type"><option>PDF / document</option><option>Image</option><option>Video</option><option>Website link</option><option>Text / portfolio</option><option>Other file</option></select><label>File upload</label><input id="file" type="file"><label>Or external URL</label><input id="url" type="url" placeholder="https://..."><label>Text content</label><textarea id="text"></textarea><label><input id="publish" type="checkbox" checked style="width:auto"> Publish on my public page</label><button class="primary" style="margin-top:12px">Save content online</button><p id="saveerr"></p></form><div class="section"><h2>My content</h2></div><div class="grid">${(mine||[]).map(i=>`<article class="item"><span class="tag">${i.is_published?'PUBLISHED':'DRAFT'}</span><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p><button onclick="togglePublish('${i.id}',${!i.is_published})">${i.is_published?'Unpublish':'Publish'}</button><button onclick="deleteContent('${i.id}')">Delete</button></article>`).join('')||'<div class="empty">No content yet.</div>'}</div>`);$('#contentform').onsubmit=async e=>{e.preventDefault();const out=$('#saveerr');out.textContent='Uploading…';let storage_path=null;const f=$('#file').files[0];if(f){const path=me.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from('privexa-files').upload(path,f,{upsert:false});if(up.error){out.textContent=up.error.message;return}storage_path=path}const row={owner_id:me.id,title:$('#title').value.trim(),description:$('#description').value.trim(),content_type:$('#type').value,url:$('#url').value.trim()||null,text_content:$('#text').value.trim()||null,storage_path,is_published:$('#publish').checked,is_admin_content:false};const {error}=await db.from('content_items').insert(row);if(error){out.textContent=error.message;return}await dashboard()}}
async function publicPage(s){const {data:p,error}=await db.from('profiles').select('id,display_name,slug,bio').eq('slug',s).maybeSingle();if(error||!p){app('<div class="hero"><h1>Page not found</h1><button onclick="location.hash=\'#/\'">Home</button></div>');return}const [fs,its]=await Promise.all([getPublicFolders(p.id),getPublicItems(p.id)]);app(`<div class="hero"><span class="tag">PUBLIC CREATOR PAGE</span><h1>${esc(p.display_name||'Creator')}'s space</h1><p>${esc(p.bio||'Published resources and portfolio.')}</p><p><a href="${esc(publicUrl(p.slug))}">${esc(publicUrl(p.slug))}</a></p></div><div class="section"><h2>Folders</h2></div><div class="grid">${fs.length?fs.map(folderCard).join(''):'<div class="empty">No published folders.</div>'}</div><div class="section"><h2>Published content</h2></div><div class="grid">${its.length?its.map(itemCard).join(''):'<div class="empty">No published content yet.</div>'}</div>`)}
async function openFolder(id){const {data:f}=await db.from('folders').select('*').eq('id',id).maybeSingle();if(!f)return;const {data:its}=await db.from('content_items').select('*').eq('folder_id',id).eq('is_published',true);app(`<div class="hero"><button onclick="history.back()">← Back</button><h1>${esc(f.title)}</h1><p>${esc(f.description||'')}</p></div><div class="grid">${its?.length?its.map(itemCard).join(''):'<div class="empty">No published content in this folder.</div>'}</div>`)}
async function adminPage(){if(!me){location.hash='#/login';return}await loadProfile();if(!isAdmin){app('<div class="hero"><h1>Admin access required</h1><p>Sign in with an account that has the admin role assigned in Supabase.</p></div>');return}const {data:its,error}=await db.from('content_items').select('*').order('created_at',{ascending:false});const {data:fs}=await db.from('folders').select('*').order('created_at',{ascending:false});if(error){app(`<div class="notice">${msg(error)}</div>`);return}app(`<div class="hero"><span class="tag">ADMIN PANEL</span><h1>Publish official content</h1><p>Items marked as admin content appear on the shared homepage. Customer content stays on creator pages.</p></div><div class="split"><form class="panel" id="adminitem"><h2>Publish content</h2><label>Title</label><input id="atitle" required><label>Description</label><textarea id="adesc"></textarea><label>Type</label><select id="atype"><option>PDF / document</option><option>Image</option><option>Video</option><option>Website link</option><option>Text / portfolio</option></select><label>File upload</label><input id="afile" type="file"><label>Or URL</label><input id="aurl" type="url"><label>Text content</label><textarea id="atext"></textarea><label><input id="apub" type="checkbox" checked style="width:auto"> Publish on homepage</label><button class="primary" style="margin-top:12px">Save admin content</button><p id="aerr"></p></form><form class="panel" id="adminfolder"><h2>Publish folder</h2><label>Folder title</label><input id="ftitle" required><label>Description</label><textarea id="fdesc"></textarea><label><input id="fpub" type="checkbox" checked style="width:auto"> Publish on homepage</label><button class="primary" style="margin-top:12px">Save folder</button><p id="ferr"></p></form></div><div class="section"><h2>All content</h2></div><div class="grid">${(its||[]).map(i=>`<article class="item"><span class="tag">${i.is_admin_content?'ADMIN':'CUSTOMER'} · ${i.is_published?'PUBLISHED':'DRAFT'}</span><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p><button onclick="adminToggle('${i.id}',${!i.is_published})">${i.is_published?'Unpublish':'Publish'}</button><button onclick="adminDelete('${i.id}')">Delete</button></article>`).join('')||'<div class="empty">No content.</div>'}</div><div class="section"><h2>Folders</h2></div><div class="grid">${(fs||[]).map(f=>`<article class="item"><h3>${esc(f.title)}</h3><p>${f.is_admin_content?'Admin':'Customer'} · ${f.is_published?'Published':'Draft'}</p><button onclick="adminFolderToggle('${f.id}',${!f.is_published})">${f.is_published?'Unpublish':'Publish'}</button></article>`).join('')||'<div class="empty">No folders.</div>'}</div>`);
$('#adminitem').onsubmit=async e=>{e.preventDefault();let storage_path=null;const f=$('#afile').files[0];if(f){const path=me.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from('privexa-files').upload(path,f);if(up.error){$('#aerr').textContent=up.error.message;return}storage_path=path}const {error}=await db.from('content_items').insert({owner_id:me.id,title:$('#atitle').value.trim(),description:$('#adesc').value.trim(),content_type:$('#atype').value,url:$('#aurl').value.trim()||null,text_content:$('#atext').value.trim()||null,storage_path,is_published:$('#apub').checked,is_admin_content:true});if(error)$('#aerr').textContent=error.message;else adminPage()};$('#adminfolder').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('folders').insert({owner_id:me.id,title:$('#ftitle').value.trim(),description:$('#fdesc').value.trim(),is_published:$('#fpub').checked,is_admin_content:true});if(error)$('#ferr').textContent=error.message;else adminPage()}}
async function togglePublish(id,v){const {error}=await db.from('content_items').update({is_published:v}).eq('id',id);if(error)alert(error.message);else dashboard()}async function deleteContent(id){if(confirm('Delete this content?')){const {error}=await db.from('content_items').delete().eq('id',id);if(error)alert(error.message);else dashboard()}}async function adminToggle(id,v){const {error}=await db.from('content_items').update({is_published:v}).eq('id',id);if(error)alert(error.message);else adminPage()}async function adminDelete(id){if(confirm('Delete content?')){const {error}=await db.from('content_items').delete().eq('id',id);if(error)alert(error.message);else adminPage()}}async function adminFolderToggle(id,v){const {error}=await db.from('folders').update({is_published:v}).eq('id',id);if(error)alert(error.message);else adminPage()}
async function logout(){await db.auth.signOut();me=null;profile=null;location.hash='#/';await route()}async function route(){const p=decodeURIComponent((location.hash.slice(1)||'/')).split('/').filter(Boolean);if(!p.length)return explore();if(p[0]==='login')return authPage('login');if(p[0]==='register')return authPage('register');if(p[0]==='dashboard')return dashboard();if(p[0]==='admin')return adminPage();return publicPage(p[0])}
init();
</script></body></html>
