<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIVEXA — Publish, Share, Unlock</title>
<style>
:root{--bg:#090b12;--panel:#121624;--panel2:#1a2030;--line:#2a3044;--text:#f5f6ff;--muted:#a9b1c7;--purple:#b6a0ff;--cyan:#75e6ef;--red:#ff879a;--green:#8ee6b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#28204b 0,transparent 32%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--text);cursor:pointer}button:hover{border-color:var(--purple)}button.primary{background:var(--purple);border-color:var(--purple);color:#171326;font-weight:800}button.danger{color:#ffc1ca;border-color:#713342}input,textarea,select{width:100%;border:1px solid var(--line);background:#0c1019;color:var(--text);border-radius:9px;padding:11px}textarea{min-height:90px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input[type=checkbox]{width:auto}.wrap{max-width:1160px;padding:20px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0 18px}.logo{font-size:25px;font-weight:950;letter-spacing:3px}.logo span{color:var(--purple)}.nav{display:flex;gap:8px;flex-wrap:wrap}.hero{padding:36px 0 22px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.1;margin:8px 0}.hero p,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.panel,.item{background:linear-gradient(145deg,var(--panel),#0e1119);border:1px solid var(--line);border-radius:16px;padding:17px;min-width:0}.item h3{margin:10px 0 5px;overflow-wrap:anywhere}.item p{color:var(--muted);overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11px;color:var(--muted)}.tag.public{color:var(--green);border-color:#315b49}.tag.locked{color:#ffb2bf;border-color:#713342}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button.active{color:var(--purple);border-color:var(--purple)}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 12px}.section h2{margin:0}.notice{padding:13px 15px;border:1px solid #494064;background:#171527;border-radius:12px;margin:12px 0;color:#e2dcff}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.small{font-size:12px}.price{font-size:23px;font-weight:900;margin:10px 0}.link{color:var(--cyan);overflow-wrap:anywhere}.hidden{display:none!important}.avatar{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:var(--panel2);font-size:25px;font-weight:800}.preview{max-width:100%;max-height:300px;border-radius:10px}.footer{border-top:1px solid var(--line);padding:20px 0;margin-top:40px;color:var(--muted);font-size:12px}.filebox{border:1px solid var(--line);border-radius:10px;padding:12px;background:#0d111b}.stats{font-size:26px;font-weight:900}.right{margin-left:auto}a{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="logo">PRIV<span>EXA</span></div>
  <nav class="nav">
    <button onclick="go('#/')">Explore</button>
    <button onclick="go('#/login')">Customer login</button>
    <button class="primary" onclick="go('#/register')">Create account</button>
    <button onclick="go('#/admin')">Admin</button>
  </nav>
</header>
<main id="app"></main>
<div class="footer">PRIVEXA · Public content is free. Only selected locked folders or PDFs require payment. · Demo prototype only.</div>
</div>
<script>
(() => {
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('privexa_'+k))??d}catch{return d}};
const write=(k,v)=>localStorage.setItem('privexa_'+k,JSON.stringify(v));
let users=read('users',[]),items=read('items',[]),folders=read('folders',[]),requests=read('requests',[]),settings=read('settings',{upi:'your-upi@bank',qr:'',siteName:'PRIVEXA'}),session=read('session',null),admin=false,tab='overview';
const app=s=>$('#app').innerHTML=s;
const me=()=>users.find(u=>u.id===session);
const save=()=>{write('users',users);write('items',items);write('folders',folders);write('requests',requests);write('settings',settings);write('session',session)};
const slugify=s=>(s||'creator').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'creator';
function uniqueSlug(s,id){const base=slugify(s);let out=base,n=2;while(users.some(u=>u.slug===out&&u.id!==id))out=base+'-'+n++;return out}
const pageUrl=u=>location.href.split('#')[0]+'#/'+encodeURIComponent(u.slug);
const ownerName=id=>{const u=users.find(x=>x.id===id);return u?(u.displayName||u.name):'PRIVEXA Admin'};
const ownerItems=id=>items.filter(i=>i.ownerId===id&&i.published&&!i.private);
const isFolderPaid=(folderId,userId=session)=>requests.some(r=>r.folderId===folderId&&r.userId===userId&&r.status==='approved');
const isItemPaid=(itemId,userId=session)=>requests.some(r=>r.itemId===itemId&&r.userId===userId&&r.status==='approved');
function getFolder(id){return folders.find(f=>f.id===id)}
function getItem(id){return items.find(i=>i.id===id)}
function fileUrl(i){return i.dataUrl||i.url||''}
function openFreeItem(i){const url=fileUrl(i);if(url){window.open(url,'_blank','noopener');return}if(i.text){app(`<button onclick="history.back()">← Back</button><div class="hero"><span class="tag public">PUBLIC CONTENT</span><h1>${esc(i.title)}</h1><p>${esc(i.description||'')}</p></div><div class="panel" style="white-space:pre-wrap">${esc(i.text)}</div>`);return}alert('No file, URL, or text is attached to this item yet.')}
function openItem(id){const i=getItem(id);if(!i)return;if(i.locked&&!isItemPaid(i.id)&&!(i.folderId&&isFolderPaid(i.folderId))){paymentScreen({kind:'item',id:i.id,title:i.title,description:i.description,price:i.price,ownerId:i.ownerId});return}openFreeItem(i)}
function card(i){return `<article class="item"><div class="row"><span class="tag ${i.locked?'locked':'public'}">${i.locked?'LOCKED':'PUBLIC · FREE'}</span><span class="tag">${esc(i.type||'Content')}</span></div><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p><p class="small">Published by ${esc(ownerName(i.ownerId))}</p>${i.locked?`<div class="price">₹${esc(i.price||'0')}</div><button class="primary" onclick="openItem('${i.id}')">Payment / unlock</button>`:`<button class="primary" onclick="openItem('${i.id}')">Open / access</button>`}</article>`}
function folderCard(f){return `<article class="item"><span class="tag ${f.locked?'locked':'public'}">${f.locked?'LOCKED FOLDER':'PUBLIC FOLDER · FREE'}</span><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p><p class="small">By ${esc(ownerName(f.ownerId))}</p>${f.locked?`<div class="price">₹${esc(f.price||'0')}</div><button class="primary" onclick="openFolder('${f.id}')">Payment / unlock folder</button>`:`<button class="primary" onclick="openFolder('${f.id}')">Open folder</button>`}</article>`}
function renderExplore(){const pubItems=items.filter(i=>i.ownerId==='__admin__'&&i.published&&!i.private);const pubFolders=folders.filter(f=>f.ownerId==='__admin__'&&f.published);app(`<section class="hero"><span class="tag public">PUBLIC CONTENT · FREE ACCESS</span><h1>Publish. Share.<br><span style="color:var(--purple)">Unlock what matters.</span></h1><p>The PRIVEXA homepage shows official content published by the admin. Customer content appears only on each customer's dashboard and personal public link. Public customer items are free; selected locked folders or PDFs require payment.</p><div class="row" style="max-width:440px"><button class="primary" onclick="go('#/register')">Create your space</button><button onclick="go('#/login')">Sign in</button></div></section><div class="section"><h2>Published folders</h2><span class="tag">PUBLIC + LOCKED</span></div><div class="grid">${pubFolders.length?pubFolders.map(folderCard).join(''):'<div class="empty">No folders published yet.</div>'}</div><div class="section"><h2>Public content</h2><span class="tag public">FREE</span></div><div class="grid">${pubItems.length?pubItems.map(card).join(''):'<div class="empty">No public content published yet.</div>'}</div><div class="section"><h2>Open a creator page</h2></div><div class="panel"><label>Creator page slug or full URL</label><input id="findSlug" placeholder="creator-name"><button class="primary" style="margin-top:10px" onclick="openSlug()">Open creator page</button></div>`)}
function renderPublic(slug){const u=users.find(x=>x.slug===slug);if(!u){app(`<div class="hero"><h1>Page not found</h1><p>Check the link and try again.</p><button onclick="go('#/')">Explore</button></div>`);return}const pub=ownerItems(u.id),pubFolders=folders.filter(f=>f.ownerId===u.id&&f.published);app(`<div class="hero"><div class="row"><div class="avatar">${esc((u.displayName||u.name||'?').slice(0,1).toUpperCase())}</div><div><span class="tag public">PUBLIC CREATOR PAGE</span><h1>${esc(u.displayName||u.name)}'s space</h1><p>${esc(u.bio||'Published portfolio, resources, documents and links.')}</p><p class="small">Share: <a class="link" href="${esc(pageUrl(u))}">${esc(pageUrl(u))}</a></p></div></div></div><div class="notice">Public published content is free to open. Locked folders and PDFs require payment only for that specific item or folder. Admin must approve the payment proof before access is granted.</div><div class="section"><h2>Published folders</h2></div><div class="grid">${pubFolders.length?pubFolders.map(folderCard).join(''):'<div class="empty">No published folders.</div>'}</div><div class="section"><h2>Published content</h2></div><div class="grid">${pub.length?pub.map(card).join(''):'<div class="empty">No published content yet.</div>'}</div>`)}
function renderAdminPublic(){const its=ownerItems('__admin__'),fs=folders.filter(f=>f.ownerId==='__admin__'&&f.published);app(`<div class="hero"><span class="tag public">OFFICIAL PRIVEXA CONTENT</span><h1>Published by Admin</h1><p>All admin-published content is visible here. Public items are free; locked folders or PDFs require separate payment.</p></div><div class="section"><h2>Published folders</h2></div><div class="grid">${fs.length?fs.map(folderCard).join(''):'<div class="empty">No admin folders published yet.</div>'}</div><div class="section"><h2>Published content</h2></div><div class="grid">${its.length?its.map(card).join(''):'<div class="empty">No admin content published yet.</div>'}</div>`)}
function renderAuth(kind){app(`<div class="hero"><h1>${kind==='register'?'Create your PRIVEXA space':'Customer sign in'}</h1><p>Each account has its own dashboard and unique public page link.</p></div><div class="panel" style="max-width:520px"><form id="authForm">${kind==='register'?'<label>Name</label><input id="authName" required placeholder="Your name">':''}<label>Email</label><input id="authEmail" type="email" required placeholder="you@example.com"><label>Password</label><input id="authPass" type="password" minlength="6" required placeholder="At least 6 characters"><button class="primary" style="margin-top:14px;width:100%">${kind==='register'?'Create account':'Sign in'}</button></form><p class="small muted">${kind==='register'?'Already registered?':'Need an account?'} <a href="#/${kind==='register'?'login':'register'}">${kind==='register'?'Sign in':'Register'}</a></p><div id="authErr" style="color:var(--red)"></div></div>`);
$('#authForm').onsubmit=e=>{e.preventDefault();const email=$('#authEmail').value.trim().toLowerCase(),pass=$('#authPass').value;if(kind==='register'){if(users.some(u=>u.email===email)){$('#authErr').textContent='Email already registered.';return}const name=$('#authName').value.trim(),u={id:uid(),name,displayName:name,email,password:pass,slug:uniqueSlug(name),bio:''};users.push(u);session=u.id;save();go('#/dashboard')}else{const u=users.find(x=>x.email===email&&x.password===pass);if(!u){$('#authErr').textContent='Incorrect email or password.';return}session=u.id;save();go('#/dashboard')}};
}
function renderDashboard(){const u=me();if(!u){go('#/login');return}const mine=items.filter(i=>i.ownerId===u.id),myFolders=folders.filter(f=>f.ownerId===u.id),myReq=requests.filter(r=>r.userId===u.id);const tabs=[['overview','Overview'],['content','My content'],['folders','My folders'],['profile','Public page'],['payments','My purchases']];app(`<div class="hero"><span class="tag">CUSTOMER DASHBOARD</span><h1>Hello, ${esc(u.displayName||u.name)}</h1><p>Upload and publish your content. Public items are free; choose locked access only for content you want to charge for.</p></div><div class="panel"><div class="row"><div><div class="small muted">YOUR PERSONAL WEBSITE LINK</div><a class="link" href="${esc(pageUrl(u))}" target="_blank">${esc(pageUrl(u))}</a></div><button onclick="copyMyLink()">Copy link</button><button class="primary" onclick="window.open(pageUrl(me()),'_blank')">Open public page</button></div></div><div class="tabs">${tabs.map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${l}</button>`).join('')}<button onclick="logout()">Sign out</button></div><div id="dash"></div>`);
const d=$('#dash');
if(tab==='overview')d.innerHTML=`<div class="grid"><div class="panel"><div class="muted">Your content</div><div class="stats">${mine.length}</div></div><div class="panel"><div class="muted">Your folders</div><div class="stats">${myFolders.length}</div></div><div class="panel"><div class="muted">Locked items</div><div class="stats">${mine.filter(i=>i.locked).length+myFolders.filter(f=>f.locked).length}</div></div><div class="panel"><div class="muted">Payment requests</div><div class="stats">${myReq.length}</div></div></div><div class="section"><h2>Quick actions</h2></div><div class="row"><button class="primary" onclick="setTab('content');setTimeout(()=>showItemForm(),0)">+ Add content</button><button onclick="setTab('folders');setTimeout(()=>showFolderForm(),0)">+ Create folder</button></div>`;
if(tab==='content')d.innerHTML=`<div class="section"><h2>My content</h2><button class="primary" onclick="showItemForm()">+ Add content</button></div><div class="grid">${mine.length?mine.map(i=>`<article class="item"><div class="row"><span class="tag ${i.locked?'locked':'public'}">${i.locked?'LOCKED':'PUBLIC · FREE'}</span><span class="tag">${i.published?'PUBLISHED':'DRAFT'}</span></div><h3>${esc(i.title)}</h3><p>${esc(i.description||'')}</p><div class="row"><button onclick="showItemForm('${i.id}')">Edit</button><button onclick="toggleItem('${i.id}','published')">${i.published?'Unpublish':'Publish'}</button><button class="danger" onclick="deleteItem('${i.id}')">Delete</button></div></article>`).join(''):'<div class="empty">No content yet.</div>'}</div><div id="itemEditor"></div>`;
if(tab==='folders')d.innerHTML=`<div class="section"><h2>My folders</h2><button class="primary" onclick="showFolderForm()">+ Create folder</button></div><div class="grid">${myFolders.length?myFolders.map(f=>`<article class="item"><span class="tag ${f.locked?'locked':'public'}">${f.locked?'LOCKED FOLDER':'PUBLIC FOLDER · FREE'}</span><span class="tag">${f.published?'PUBLISHED':'DRAFT'}</span><h3>${esc(f.title)}</h3><p>${esc(f.description||'')}</p>${f.locked?`<div class="price">₹${esc(f.price||'0')}</div>`:''}<div class="row"><button onclick="showFolderForm('${f.id}')">Edit</button><button onclick="toggleFolderPublish('${f.id}')">${f.published?'Unpublish':'Publish'}</button><button class="danger" onclick="deleteFolder('${f.id}')">Delete</button></div></article>`).join(''):'<div class="empty">Create public or locked folders to organize content.</div>'}</div><div id="folderEditor"></div>`;
if(tab==='profile')d.innerHTML=`<div class="panel"><h2>Public page settings</h2><label>Display name</label><input id="profName" value="${esc(u.displayName||u.name)}"><label>About / bio</label><textarea id="profBio">${esc(u.bio||'')}</textarea><label>Page slug</label><input id="profSlug" value="${esc(u.slug)}"><button class="primary" style="margin-top:12px" onclick="saveProfile()">Save</button><p class="small muted">Public profile information is visible to everyone.</p></div>`;
if(tab==='payments')d.innerHTML=`<div class="section"><h2>My purchases</h2></div><div class="grid">${myReq.length?myReq.map(r=>`<article class="item"><h3>${esc(r.folderTitle||r.itemTitle)}</h3><p>Amount: ₹${esc(r.amount)}</p><span class="tag">${esc(r.status.toUpperCase())}</span>${r.status==='approved'?`<button class="primary" onclick="${r.folderId?`openFolder('${r.folderId}')`:`openItem('${r.itemId}')`}">Open purchased content</button>`:''}</article>`).join(''):'<div class="empty">No payment requests yet.</div>'}</div>`;
}
function setTab(t){tab=t;renderDashboard()}
function showItemForm(id){const d=$('#itemEditor');if(!d)return;const old=id?getItem(id):null;const fs=folders.filter(f=>f.ownerId===session);d.innerHTML=`<div class="section"><h2>${old?'Edit content':'Add content'}</h2></div><div class="panel"><form id="itemForm"><label>Title</label><input id="iTitle" required value="${esc(old?.title||'')}"><label>Description</label><textarea id="iDesc">${esc(old?.description||'')}</textarea><label>Type</label><select id="iType">${['PDF / document','Image','Video','Website link','Text / portfolio','Other file'].map(t=>`<option ${old?.type===t?'selected':''}>${t}</option>`).join('')}</select><label>Upload file (prototype limit 2 MB)</label><input id="iFile" type="file"><label>Or URL</label><input id="iUrl" type="url" value="${esc(old?.url||'')}" placeholder="https://..."><label>Text content (optional)</label><textarea id="iText">${esc(old?.text||'')}</textarea><label>Folder</label><select id="iFolder"><option value="">No folder</option>${fs.map(f=>`<option value="${f.id}" ${old?.folderId===f.id?'selected':''}>${esc(f.title)}${f.locked?' (locked)':''}</option>`).join('')}</select><label>Access</label><select id="iLock"><option value="public" ${!old?.locked?'selected':''}>Public — free access</option><option value="locked" ${old?.locked?'selected':''}>Locked — payment required</option></select><label>Price if locked</label><input id="iPrice" type="number" min="0" step="0.01" value="${esc(old?.price||'')}"><label><input id="iPublish" type="checkbox" ${old?.published?'checked':''}> Publish on my public page</label><button class="primary" style="margin-top:14px">Save content</button></form></div>`;
$('#itemForm').onsubmit=async e=>{e.preventDefault();const f=$('#iFile').files[0];let dataUrl=old?.dataUrl||'',fileName=old?.fileName||'';if(f){if(f.size>2*1024*1024){alert('Prototype file limit is 2 MB. Use cloud storage for production.');return}dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});fileName=f.name}const folder=getFolder($('#iFolder').value);const obj={...(old||{}),id:old?.id||uid(),ownerId:session,title:$('#iTitle').value.trim(),description:$('#iDesc').value.trim(),type:$('#iType').value,url:$('#iUrl').value.trim(),text:$('#iText').value.trim(),dataUrl,fileName,folderId:folder?.id||'',locked:$('#iLock').value==='locked'||!!folder?.locked,price:folder?.locked?folder.price:($('#iLock').value==='locked'?$('#iPrice').value:''),published:$('#iPublish').checked,private:false};if(old)items=items.map(x=>x.id===old.id?obj:x);else items.push(obj);save();renderDashboard()};
}
function showFolderForm(id){const d=$('#folderEditor');if(!d)return;const old=id?getFolder(id):null;d.innerHTML=`<div class="section"><h2>${old?'Edit folder':'Create folder'}</h2></div><div class="panel"><form id="folderForm"><label>Folder name</label><input id="fTitle" required value="${esc(old?.title||'')}"><label>Description</label><textarea id="fDesc">${esc(old?.description||'')}</textarea><label>Folder access</label><select id="fLock"><option value="public" ${!old?.locked?'selected':''}>Public — free</option><option value="locked" ${old?.locked?'selected':''}>Locked — payment required for this folder</option></select><label>Price</label><input id="fPrice" type="number" min="0" step="0.01" value="${esc(old?.price||'')}"><label><input id="fPublish" type="checkbox" ${old?.published?'checked':''}> Publish folder</label><button class="primary" style="margin-top:14px">Save folder</button></form><p class="small muted">Payment unlocks only this folder. Other locked folders remain locked.</p></div>`;
$('#folderForm').onsubmit=e=>{e.preventDefault();const obj={...(old||{}),id:old?.id||uid(),ownerId:session,title:$('#fTitle').value.trim(),description:$('#fDesc').value.trim(),locked:$('#fLock').value==='locked',price:$('#fPrice').value,published:$('#fPublish').checked};if(old)folders=folders.map(x=>x.id===old.id?obj:x);else folders.push(obj);items=items.map(i=>i.folderId===obj.id?{...i,locked:obj.locked,price:obj.locked?obj.price:'',published:obj.published&&i.published}:i);save();renderDashboard()};
}
function toggleItem(id,key){items=items.map(i=>i.id===id?{...i,[key]:!i[key]}:i);save();renderDashboard()}
function deleteItem(id){if(confirm('Delete this content?')){items=items.filter(i=>i.id!==id);save();renderDashboard()}}
function toggleFolderPublish(id){folders=folders.map(f=>f.id===id?{...f,published:!f.published}:f);save();renderDashboard()}
function deleteFolder(id){if(confirm('Delete folder? Files will be unassigned.')){folders=folders.filter(f=>f.id!==id);items=items.map(i=>i.folderId===id?{...i,folderId:''}:i);save();renderDashboard()}}
function saveProfile(){const u=me();u.displayName=$('#profName').value.trim()||u.name;u.bio=$('#profBio').value.trim();u.slug=uniqueSlug($('#profSlug').value,u.id);save();alert('Profile saved');renderDashboard()}
function copyMyLink(){const url=pageUrl(me());if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>alert('Link copied')).catch(()=>prompt('Copy your link:',url))}else prompt('Copy your link:',url)}
function logout(){session=null;save();go('#/')}
function paymentScreen(p){const isFolder=p.kind==='folder';app(`<button onclick="history.back()">← Back</button><div class="hero"><span class="tag locked">LOCKED ${isFolder?'FOLDER':'PDF / CONTENT'}</span><h1>${esc(p.title)}</h1><p>${esc(p.description||'')}</p><div class="price">₹${esc(p.price||'0')}</div><p>Pay for this specific ${isFolder?'folder':'item'} only. After uploading proof, wait for admin confirmation before access is granted.</p></div><div class="split"><div class="panel"><h2>1. Pay using UPI</h2><p>UPI ID: <b>${esc(settings.upi)}</b></p>${settings.qr?`<img class="preview" src="${settings.qr}" alt="UPI QR code">`:''}<p class="small muted">Use the UPI ID or scan the QR code. Save your payment confirmation screenshot.</p></div><div class="panel"><h2>2. Submit payment proof</h2><label>UPI transaction/reference ID</label><input id="proofRef" placeholder="Enter transaction ID"><label>Payment screenshot (required)</label><input id="proofFile" type="file" accept="image/*"><button class="primary" style="margin-top:14px" onclick="submitProof('${p.kind}','${p.id}')">Submit for admin confirmation</button><p class="small muted">Access stays locked until the admin verifies and approves this request.</p></div></div>`)}
async function submitProof(kind,id){const ref=$('#proofRef').value.trim(),file=$('#proofFile').files[0];if(!session){alert('Please sign in or create an account before submitting payment proof.');go('#/login');return}if(!ref){alert('Enter the UPI transaction/reference ID.');return}if(!file){alert('Upload the payment screenshot proof.');return}if(file.size>1.5*1024*1024){alert('Screenshot limit is 1.5 MB in this prototype.');return}const proof=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});const target=kind==='folder'?getFolder(id):getItem(id);if(!target)return;requests.push({id:uid(),kind,folderId:kind==='folder'?id:(target.folderId||''),itemId:kind==='item'?id:'',folderTitle:kind==='folder'?target.title:'',itemTitle:target.title,ownerId:target.ownerId,userId:session,amount:target.price,reference:ref,proof,status:'pending',createdAt:Date.now()});save();app(`<div class="hero"><h1>Payment proof submitted</h1><p>Your request is pending admin verification. This specific ${kind} opens only after admin approval.</p><button class="primary" onclick="go('#/dashboard')">Go to dashboard</button><button onclick="go('#/')">Explore website</button></div>`)}
function openFolder(id){const f=getFolder(id);if(!f)return;if(f.locked&&!isFolderPaid(id)){paymentScreen({kind:'folder',id,title:f.title,description:f.description,price:f.price});return}const list=items.filter(i=>i.folderId===id&&i.published);app(`<button onclick="history.back()">← Back</button><div class="hero"><h1>${esc(f.title)}</h1><p>${esc(f.description||'')}</p>${f.locked?'<span class="tag public">ACCESS APPROVED</span>':''}</div><div class="grid">${list.length?list.map(card).join(''):'<div class="empty">No published files in this folder.</div>'}</div>`)}
function renderAdminLogin(){app(`<div class="hero"><h1>Admin login</h1><p>Full platform controls are available only after admin sign-in.</p></div><div class="panel" style="max-width:520px"><label>Email</label><input id="adminEmail" type="email"><label>Password</label><input id="adminPassword" type="password"><button class="primary" style="margin-top:14px" onclick="adminLogin()">Sign in as admin</button><div id="adminErr" style="color:var(--red)"></div><p class="small muted">Demo credentials are listed in README.txt. Change them before deployment.</p></div>`)}
function adminLogin(){if($('#adminEmail').value.trim().toLowerCase()==='Monumuhammed92@gmail.com'&&$('#adminPassword').value==='8943752109'){admin=true;renderAdmin()}else $('#adminErr').textContent='Invalid demo credentials.'}
function renderAdmin(){const pending=requests.filter(r=>r.status==='pending');app(`<div class="hero"><span class="tag">ADMIN CONTROL PANEL</span><h1>Full website management</h1><p>Manage customer accounts, published content, folders, prices, payment proof, approvals, and UPI settings.</p></div><div class="tabs"><button onclick="renderAdmin()">Overview</button><button onclick="adminCustomers()">Customers</button><button onclick="adminContent()">Content & folders</button><button onclick="adminPayments()">Payment approvals (${pending.length})</button><button onclick="adminPaymentSettings()">UPI settings</button><button onclick="go('#/admin-published')">View public admin page</button><button onclick="admin=false;go('#/')">Exit admin</button></div><div class="grid"><div class="panel"><div class="muted">Customers</div><div class="stats">${users.length}</div></div><div class="panel"><div class="muted">Content items</div><div class="stats">${items.length}</div></div><div class="panel"><div class="muted">Folders</div><div class="stats">${folders.length}</div></div><div class="panel"><div class="muted">Pending payments</div><div class="stats">${pending.length}</div></div></div>`)}
function adminCustomers(){app(`<div class="section"><h2>Customers</h2><button onclick="renderAdmin()">Back</button></div><div class="grid">${users.map(u=>`<article class="item"><h3>${esc(u.displayName||u.name)}</h3><p>${esc(u.email)}</p><a href="${esc(pageUrl(u))}" target="_blank">${esc(pageUrl(u))}</a><button style="margin-top:10px" onclick="window.open(pageUrl(users.find(x=>x.id==='${u.id}')),'_blank')">Open page</button></article>`).join('')||'<div class="empty">No customers yet.</div>'}</div>`)}
function adminContent(){app(`<div class="section"><h2>Manage content and folders</h2><button onclick="renderAdmin()">Back</button></div><div class="row"><button class="primary" onclick="adminItemForm()">+ Publish admin content</button><button onclick="adminFolderForm()">+ Publish admin folder</button></div><div id="adminEditor"></div><div class="section"><h2>All content</h2></div><div class="grid">${items.map(i=>`<article class="item"><h3>${esc(i.title)}</h3><p>Owner: ${esc(ownerName(i.ownerId))}</p><p>${i.published?'Published':'Draft'} · ${i.locked?'Locked':'Public'}</p><div class="row"><button onclick="adminToggleItem('${i.id}')">${i.published?'Unpublish':'Publish'}</button><button class="danger" onclick="adminDeleteItem('${i.id}')">Delete</button></div></article>`).join('')||'<div class="empty">No content.</div>'}</div><div class="section"><h2>All folders</h2></div><div class="grid">${folders.map(f=>`<article class="item"><h3>${esc(f.title)}</h3><p>Owner: ${esc(ownerName(f.ownerId))}</p><p>${f.published?'Published':'Draft'} · ${f.locked?'Locked':'Public'} · ₹${esc(f.price||'0')}</p><div class="row"><button onclick="adminToggleFolder('${f.id}')">${f.published?'Unpublish':'Publish'}</button><button class="danger" onclick="adminDeleteFolder('${f.id}')">Delete</button></div></article>`).join('')||'<div class="empty">No folders.</div>'}</div>`)}
function adminItemForm(){const d=$('#adminEditor');d.innerHTML=`<div class="panel"><h2>Publish content as admin</h2><form id="adminItemForm"><label>Title</label><input id="aiTitle" required><label>Description</label><textarea id="aiDesc"></textarea><label>Type</label><select id="aiType"><option>PDF / document</option><option>Image</option><option>Video</option><option>Website link</option><option>Text / portfolio</option><option>Other file</option></select><label>File (2 MB prototype limit)</label><input id="aiFile" type="file"><label>Or URL</label><input id="aiUrl" type="url" placeholder="https://..."><label>Text content</label><textarea id="aiText"></textarea><label>Put inside admin folder (optional)</label><select id="aiFolder"><option value="">No folder</option>${folders.filter(f=>f.ownerId==='__admin__').map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join('')}</select><label>Access</label><select id="aiLock"><option value="public">Public — free</option><option value="locked">Locked — payment required</option></select><label>Price if locked</label><input id="aiPrice" type="number" min="0" step="0.01"><label><input id="aiPublish" type="checkbox" checked> Publish now</label><button class="primary" style="margin-top:12px">Save and publish</button></form></div>`;
$('#adminItemForm').onsubmit=async e=>{e.preventDefault();const f=$('#aiFile').files[0];let dataUrl='',fileName='';if(f){if(f.size>2*1024*1024){alert('Prototype file limit is 2 MB.');return}dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});fileName=f.name}const folder=getFolder($('#aiFolder').value);items.push({id:uid(),ownerId:'__admin__',title:$('#aiTitle').value.trim(),description:$('#aiDesc').value.trim(),type:$('#aiType').value,url:$('#aiUrl').value.trim(),text:$('#aiText').value.trim(),dataUrl,fileName,folderId:folder?.id||'',locked:$('#aiLock').value==='locked'||!!folder?.locked,price:folder?.locked?folder.price:$('#aiPrice').value,published:$('#aiPublish').checked,private:false});save();adminContent()}}
function adminFolderForm(){const d=$('#adminEditor');d.innerHTML=`<div class="panel"><h2>Publish folder as admin</h2><form id="adminFolderForm"><label>Folder name</label><input id="afTitle" required><label>Description</label><textarea id="afDesc"></textarea><label>Access</label><select id="afLock"><option value="public">Public — free</option><option value="locked">Locked — payment required</option></select><label>Folder price</label><input id="afPrice" type="number" min="0" step="0.01"><label><input id="afPublish" type="checkbox" checked> Publish folder</label><button class="primary" style="margin-top:12px">Save folder</button></form></div>`;
$('#adminFolderForm').onsubmit=e=>{e.preventDefault();folders.push({id:uid(),ownerId:'__admin__',title:$('#afTitle').value.trim(),description:$('#afDesc').value.trim(),locked:$('#afLock').value==='locked',price:$('#afPrice').value,published:$('#afPublish').checked});save();adminContent()}}
function adminToggleItem(id){items=items.map(i=>i.id===id?{...i,published:!i.published}:i);save();adminContent()}
function adminDeleteItem(id){if(confirm('Delete this item?')){items=items.filter(i=>i.id!==id);save();adminContent()}}
function adminToggleFolder(id){folders=folders.map(f=>f.id===id?{...f,published:!f.published}:f);save();adminContent()}
function adminDeleteFolder(id){if(confirm('Delete this folder?')){folders=folders.filter(f=>f.id!==id);items=items.map(i=>i.folderId===id?{...i,folderId:''}:i);save();adminContent()}}
function adminPayments(){app(`<div class="section"><h2>Payment proof review</h2><button onclick="renderAdmin()">Back</button></div><div class="grid">${requests.length?requests.map(r=>`<article class="item"><span class="tag ${r.status==='approved'?'public':'locked'}">${esc(r.status.toUpperCase())}</span><h3>${esc(r.folderTitle||r.itemTitle)}</h3><p>Customer: ${esc(users.find(u=>u.id===r.userId)?.email||'Unknown')}</p><p>Amount: ₹${esc(r.amount)}</p><p>UPI reference: ${esc(r.reference)}</p>${r.proof?`<img class="preview" src="${r.proof}" alt="Payment screenshot proof">`:'<p>No screenshot attached.</p>'}${r.status==='pending'?`<div class="row"><button class="primary" onclick="decidePayment('${r.id}','approved')">Confirm & approve</button><button class="danger" onclick="decidePayment('${r.id}','rejected')">Reject</button></div>`:''}</article>`).join(''):'<div class="empty">No payment requests yet.</div>'}</div>`)}
function decidePayment(id,status){requests=requests.map(r=>r.id===id?{...r,status}:r);save();adminPayments()}
function adminPaymentSettings(){app(`<div class="panel"><h2>UPI payment settings</h2><label>UPI ID</label><input id="upiSetting" value="${esc(settings.upi)}"><label>QR image URL (optional)</label><input id="qrUrlSetting" value="${esc(settings.qr.startsWith('data:')?'':settings.qr)}"><label>Or upload QR image (prototype)</label><input id="qrFileSetting" type="file" accept="image/*"><button class="primary" style="margin-top:14px" onclick="savePaymentSettings()">Save payment settings</button><button style="margin-left:8px" onclick="renderAdmin()">Back</button><p class="small muted">Use your own UPI ID and QR. Never put private credentials here.</p></div>`)}
async function savePaymentSettings(){settings.upi=$('#upiSetting').value.trim();settings.qr=$('#qrUrlSetting').value.trim();const f=$('#qrFileSetting').files[0];if(f){if(f.size>1.5*1024*1024){alert('QR image limit is 1.5 MB.');return}settings.qr=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}save();alert('UPI settings saved');adminPaymentSettings()}
function openSlug(){let s=$('#findSlug').value.trim().replace(/^.*#\/|^.*\/u\//,'').replace(/^\/+|\/+$/g,'');go('#/'+encodeURIComponent(s))}
function go(h){location.hash=h}
function route(){const p=decodeURIComponent((location.hash.slice(1)||'/')).split('/').filter(Boolean);if(p[0]==='login'){renderAuth('login');return}if(p[0]==='register'){renderAuth('register');return}if(p[0]==='dashboard'){renderDashboard();return}if(p[0]==='admin'){renderAdminLogin();return}if(p[0]==='admin-published'){renderAdminPublic();return}if(p.length===1&&p[0]){renderPublic(p[0]);return}renderExplore()}
window.go=go;window.me=me;window.pageUrl=pageUrl;window.openItem=openItem;window.openFolder=openFolder;window.submitProof=submitProof;window.setTab=setTab;window.showItemForm=showItemForm;window.showFolderForm=showFolderForm;window.toggleItem=toggleItem;window.deleteItem=deleteItem;window.toggleFolderPublish=toggleFolderPublish;window.deleteFolder=deleteFolder;window.saveProfile=saveProfile;window.copyMyLink=copyMyLink;window.logout=logout;window.adminLogin=adminLogin;window.renderAdmin=renderAdmin;window.adminCustomers=adminCustomers;window.adminContent=adminContent;window.adminPayments=adminPayments;window.adminPaymentSettings=adminPaymentSettings;window.adminItemForm=adminItemForm;window.adminFolderForm=adminFolderForm;window.adminToggleItem=adminToggleItem;window.adminDeleteItem=adminDeleteItem;window.adminToggleFolder=adminToggleFolder;window.adminDeleteFolder=adminDeleteFolder;window.decidePayment=decidePayment;window.savePaymentSettings=savePaymentSettings;window.openSlug=openSlug;window.users=users;
window.addEventListener('hashchange',route);route();
})();
</script>
</body>
